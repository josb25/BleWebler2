<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
    <!-- Base styling -->
    <style>
        .body { fill: #f8f9fa; stroke: #dee2e6; stroke-width: 4; }
        .accent { fill: #6c757d; }
        .button { fill: #e9ecef; stroke: #ced4da; stroke-width: 2; }
        .button-inner { fill: #adb5bd; }
        .slot { fill: #343a40; }
        .label { fill: #ffffff; stroke: #e9ecef; stroke-width: 2; }
        .led { fill: #20c997; }
    </style>

    <!-- Label sticking out -->
    <rect class="label" x="70" y="20" width="60" height="40" rx="4" />
    <line x1="75" y1="35" x2="125" y2="35" stroke="#ced4da" stroke-width="2" stroke-dasharray="4,4" />

    <!-- Main Printer Body -->
    <rect class="body" x="40" y="50" width="120" height="130" rx="20" />
    
    <!-- Paper Exit Slot -->
    <rect class="slot" x="60" y="50" width="80" height="8" rx="4" />

    <!-- Cutter Button (Side) -->
    <rect class="accent" x="25" y="80" width="15" height="40" rx="5" />

    <!-- Power Button (Front) -->
    <circle class="button" cx="100" cy="130" r="25" />
    <circle class="button-inner" cx="100" cy="130" r="15" />
    <path d="M100 120 v10 m0 0" stroke="#fff" stroke-width="3" stroke-linecap="round" />
    
    <!-- Status LED -->
    <circle class="led" cx="100" cy="85" r="4" />
    
    <!-- Branding Lines -->
    <line x1="60" y1="170" x2="140" y2="170" stroke="#dee2e6" stroke-width="3" stroke-linecap="round" />
</svg>
